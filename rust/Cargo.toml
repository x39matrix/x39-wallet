[package]
name = "x39-wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoin = { version = "0.32", features = ["std", "rand-std"] }
bip39 = { version = "2.2", features = ["rand", "zeroize"] }
bdk_wallet = { version = "3", features = ["file_store"] }
bdk_electrum = "0.24"
zeroize = "1"

[dev-dependencies]
hex = "0.4"
tempfile = "3.27.0"
