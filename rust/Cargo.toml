[package]
name = "x39-wallet"
version = "0.2.0"
edition = "2021"
description = "Billetera Bitcoin de autocustodia (BIP39/BIP84, BDK, Electrum) — motor en Rust"
publish = false

[dependencies]
bitcoin = { version = "0.32", features = ["std", "rand-std"] }
bip39 = { version = "2.2", features = ["rand", "zeroize"] }
bdk_wallet = { version = "3", features = ["file_store"] }
bdk_electrum = "0.24"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hex = "0.4"
tempfile = "3.27.0"

[features]
# Por defecto SOLO redes de prueba (signet, testnet, regtest): toda la API pública rechaza
# mainnet con Error::RedProhibida. Las features de Cargo suman, no quitan: olvidar un
# flag nunca puede abrir mainnet. Para una compilación de mainnet: --features mainnet.
mainnet = []
